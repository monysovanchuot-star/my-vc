<!DOCTYPE html>
<html lang="en">
<head>
    <title>Text and Fonts Styling</title>
    <!-- បានកែផ្លូវតភ្ជាប់ទៅកាន់ Folder css/styles.css -->
    <link rel="stylesheet" type="text/css" href="../css/styles.css">
</head>
<body>
    <h1>Text and Fonts Styling Example</h1>
    <p>This is a paragraph with <span class="italic">italicized text</span>.</p>
    <p class="bold">This is a paragraph with bold text.</p>
    <p class="underline">This is a paragraph with underlined text.</p>
    <p class="blue-text">This is a paragraph with blue text.</p>
    <p class="center-align">This is a paragraph with centered text.</p>
</body>
</html>
